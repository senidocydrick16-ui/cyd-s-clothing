<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Polo Shirt - Online Shop</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="site-header">
        <h1>Online Shop</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="place-card product-detail-card">
            <div class="product-detail-image">
                <img src="https://shop.bench.com.ph/cdn/shop/files/BIY0041SG2_FL_F_ZA.jpg?v=1766140100" alt="Classic Polo Shirt">
            </div>

            <div class="product-detail-info">
                <h2>Classic Polo Shirt</h2>
                <p class="product-price">₱299.00</p>
                <p class="product-desc">A comfortable smart polo shirt with a tailored collar and buttoned placket for everyday style.</p>

                <div class="detail-group">
                    <span class="detail-label">Available Sizes:</span>
                    <div class="size-badges">
                        <span class="badge">M</span>
                        <span class="badge">L</span>
                        <span class="badge">XL</span>
                    </div>
                </div>

                <div class="detail-group">
                    <span class="detail-label">Stock Status:</span>
                    <span class="stock-badge success">12 items available</span>
                </div>

                <div class="action-buttons">
                    <button class="btn-primary">Add to Cart</button>
                    <a href="../index.html" class="btn-secondary">← Back to Products</a>
                </div>
            </div>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Online Shop. All rights reserved.</p>
    </footer>

</body>
</html>
