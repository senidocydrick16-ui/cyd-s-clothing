<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyd's Clothing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: #2c3e50;
            color: #ffffff;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .tagline {
            font-size: 1.2rem;
            font-style: italic;
            margin-top: 8px;
            color: #ecf0f1;
        }

        .owner-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .owner-section h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        .owner-section img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 15px;
            border: 3px solid #2c3e50;
        }
    </style>
</head>
<body>

    <header>
        <!-- 1. <h1> with your shop's name -->
        <h1>Cyd's Clothing</h1>

        <!-- 2. <p> tagline describing what you sell -->
        <p class="tagline">Your go-to store for comfortable, stylish, and everyday fashion essentials.</p>
    </header>

    <main>
        <!-- 3. Owner section -->
        <section class="owner-section">
            <h2>Cydrick</h2>
            <p>Hi! I am Cydrick, an ICT student and the founder of Cyd's Clothing. I aim to provide trendy, high-quality, and affordable apparel for everyone.</p>
            
            <!-- <img> element with a real alt attribute -->
            <img src="owner.jpg" alt="Photo of Cydrick, owner of Cyd's Clothing">
        </section>
    </main>

</body>
</html>
