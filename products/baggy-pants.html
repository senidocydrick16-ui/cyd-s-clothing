<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baggy Pants - Online Shop</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="site-header">
        <h1>Online Shop</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="place-card product-detail-card">
            <div class="product-detail-image">
                <img src="https://www.hallensteins.com/content/products/ab-baggy-denim-cargo-pant-swedish-black-front-10001534.jpg?optimize=high&width=450" alt="Baggy Pants">
            </div>

            <div class="product-detail-info">
                <h2>Baggy Pants</h2>
                <p class="product-price">₱250.00</p>
                <p class="product-desc">Relaxed-fit streetwear pants featuring durable denim fabric and a comfortable wide-leg silhouette.</p>

                <div class="detail-group">
                    <span class="detail-label">Available Sizes:</span>
                    <div class="size-badges">
                        <span class="badge">28</span>
                        <span class="badge">30</span>
                        <span class="badge">32</span>
                        <span class="badge">34</span>
                    </div>
                </div>

                <div class="detail-group">
                    <span class="detail-label">Stock Status:</span>
                    <span class="stock-badge warning">Only 4 items left!</span>
                </div>

                <div class="action-buttons">
                    <button class="btn-primary">Add to Cart</button>
                    <a href="../index.html" class="btn-secondary">← Back to Products</a>
                </div>
            </div>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Online Shop. All rights reserved.</p>
    </footer>

</body>
</html>
